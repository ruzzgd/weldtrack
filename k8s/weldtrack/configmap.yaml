apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: weldtrack

data:
  JWT_ALGORITHM: "HS256"

  ACCESS_TOKEN_EXPIRE_MINUTES: "120"

  AUTH_COOKIE_NAME: "access_token"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: "lax"

  BREVO_FROM_EMAIL: "noreply@weldtrack.shop"
  BREVO_FROM_NAME: "WeldTrack"

  CORS_ORIGINS: "https://weldtrack.shop,https://www.weldtrack.shop"

  ADMIN_EMAIL: "admin@gmail.com"

  MINIO_ENDPOINT: "minio.global.svc.cluster.local:9000"
  MINIO_PUBLIC_URL: "https://cdn.weldtrack.shop"
  MINIO_BUCKET: "weldtrack"
  # Cluster-internal MinIO traffic is HTTP; TLS terminates at the public ingress.
  MINIO_SECURE: "false"
