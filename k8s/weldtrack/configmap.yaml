apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: weldtrack

data:
  JWT_ALGORITHM: "HS256"

  ACCESS_TOKEN_EXPIRE_MINUTES: "120"

  AUTH_COOKIE_NAME: "access_token"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAMESITE: "lax"

  RESEND_FROM_EMAIL: "noreply@ruzzgd.dev"

  CORS_ORIGINS: "https://weldtrack.ruzzgd.dev"

  ADMIN_EMAIL: "admin@gmail.com"

  MINIO_ENDPOINT: "minio:9000"
  MINIO_PUBLIC_URL: "https://cdn-weldtrack.ruzzgd.dev"
  MINIO_BUCKET: "weldtrack"
  # Cluster-internal MinIO traffic is HTTP; TLS terminates at the public ingress.
  MINIO_SECURE: "false"
