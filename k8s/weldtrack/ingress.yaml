apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: weldtrack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - weldtrack.ruzzgd.dev
      secretName: weldtrack-tls

  rules:
    - host: weldtrack.ruzzgd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  namespace: weldtrack
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - api-weldtrack.ruzzgd.dev
      secretName: weldtrack-api-tls

  rules:
    - host: api-weldtrack.ruzzgd.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
