name: Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./weldtrackfrontend
          file: ./weldtrackfrontend/Dockerfile
          push: true

          build-args: |
            VITE_API_BASE_URL=/api

          tags: |
            ghcr.io/${{ github.repository_owner }}/weldtrack/frontend:latest
            ghcr.io/${{ github.repository_owner }}/weldtrack/frontend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./weldtrackbackend
          file: ./weldtrackbackend/Dockerfile
          push: true

          tags: |
            ghcr.io/${{ github.repository_owner }}/weldtrack/backend:latest
            ghcr.io/${{ github.repository_owner }}/weldtrack/backend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    name: Deploy to k3s
    needs:
      - build-frontend
      - build-backend

    uses: ./.github/workflows/deploy.yml
    secrets: inherit
