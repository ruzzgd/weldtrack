name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    
permissions:
  contents: read
  packages: write

jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./weldtrackfrontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/weldtrack/frontend:latest

  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./weldtrackbackend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/weldtrack/backend:latest

  trigger-deploy:
    needs: [ci-frontend, ci-backend]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit