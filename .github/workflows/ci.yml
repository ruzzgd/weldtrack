name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    
permissions:
  contents: read
  packages: write

jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHTOKEN }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./weldtrackfrontend
          file: ./weldtrackfrontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/weldtrack/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHTOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./weldtrackbackend
          file: ./weldtrackbackend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/weldtrack/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    needs: [ci-frontend, ci-backend]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit